<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Parkour 3D Urbano</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // céu azul
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Luz
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);

  // Chão com textura PBR
  const floorTexture = new THREE.TextureLoader().load("https://polyhaven.com/a/concrete_floor_001/concrete_floor_001_diff_1k.jpg");
  floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
  floorTexture.repeat.set(50, 50);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ map: floorTexture })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Carregar personagem humano (GLTF)
  let player;
  const loader = new THREE.GLTFLoader();
  loader.load("https://models.readyplayer.me/64b6f7b3b3d3a2f0c9f1.glb", function(gltf){
    player = gltf.scene;
    player.scale.set(1,1,1);
    player.position.set(0,1,0);
    scene.add(player);
  });

  // Carregar cidade urbana (GLTF)
  loader.load("https://sketchfab.com/3d-models/free-city-scene-example.glb", function(gltf){
    const cidade = gltf.scene;
    cidade.scale.set(10,10,10);
    scene.add(cidade);
  });

  // Sons
  const listener = new THREE.AudioListener();
  camera.add(listener);
  const audioLoader = new THREE.AudioLoader();

  // Som ambiente da cidade
  const citySound = new THREE.Audio(listener);
  audioLoader.load('sons/cidade.mp3', function(buffer) {
    citySound.setBuffer(buffer);
    citySound.setLoop(true);
    citySound.setVolume(0.5);
    citySound.play();
  });

  // Som de passos
  const footstepSound = new THREE.Audio(listener);
  audioLoader.load('sons/passos.mp3', function(buffer) {
    footstepSound.setBuffer(buffer);
    footstepSound.setLoop(false);
    footstepSound.setVolume(0.7);
  });

  // Som de salto
  const jumpSound = new THREE.Audio(listener);
  audioLoader.load('sons/salto.mp3', function(buffer) {
    jumpSound.setBuffer(buffer);
    jumpSound.setLoop(false);
    jumpSound.setVolume(0.8);
  });

  // Movimento básico
  const keys = {};
  let velocity = new THREE.Vector3();
  let speed = 0.2;
  let runMultiplier = 2;
  let jumpForce = 0.35;
  let gravity = -0.02;
  let onGround = true;

  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  function animate() {
    requestAnimationFrame(animate);
    if (!player) return;

    let moveSpeed = keys['ShiftLeft'] ? speed * runMultiplier : speed;

    if (keys['KeyW']) player.position.z -= moveSpeed;
    if (keys['KeyS']) player.position.z += moveSpeed;
    if (keys['KeyA']) player.position.x -= moveSpeed;
    if (keys['KeyD']) player.position.x += moveSpeed;

    // Som de passos
    if ((keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD']) && onGround) {
      if (!footstepSound.isPlaying) footstepSound.play();
    }

    // Pulo
    if (keys['Space'] && onGround) {
      velocity.y = jumpForce;
      onGround = false;
      jumpSound.play();
    }

    // Gravidade
    if (!onGround) {
      velocity.y += gravity;
      player.position.y += velocity.y;
      if (player.position.y <= 1) {
        player.position.y = 1;
        velocity.y = 0;
        onGround = true;
      }
    }

    // Câmera dinâmica
    camera.position.set(player.position.x, player.position.y + 5, player.position.z + 15);
    camera.lookAt(player.position);

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
