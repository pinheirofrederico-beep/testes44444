<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Parkour 3D Urbano</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 8px;
    }
    .bar {
      width: 200px;
      height: 20px;
      background: #333;
      border-radius: 5px;
      margin: 5px 0;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    #energy-fill { background: red; }
    #stamina-fill { background: green; }
  </style>
</head>
<body>
<div id="hud">
  <div>Energia:</div>
  <div class="bar"><div id="energy-fill" class="bar-fill" style="width:100%"></div></div>
  <div>Stamina:</div>
  <div class="bar"><div id="stamina-fill" class="bar-fill" style="width:100%"></div></div>
  <div>Pontuação: <span id="score">0</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);

  // Chão
  const floorTexture = new THREE.TextureLoader().load("https://polyhaven.com/a/concrete_floor_001/concrete_floor_001_diff_1k.jpg");
  floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
  floorTexture.repeat.set(50, 50);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ map: floorTexture })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Player
  let player;
  const loader = new THREE.GLTFLoader();
  loader.load("https://models.readyplayer.me/64b6f7b3b3d3a2f0c9f1.glb", function(gltf){
    player = gltf.scene;
    player.scale.set(1,1,1);
    player.position.set(0,1,0);
    scene.add(player);
  });

  // HUD variáveis
  let energy = 100;
  let stamina = 100;
  let score = 0;

  function updateHUD() {
    document.getElementById("energy-fill").style.width = energy + "%";
    document.getElementById("stamina-fill").style.width = stamina + "%";
    document.getElementById("score").textContent = score;
  }

  // Movimento
  const keys = {};
  let velocity = new THREE.Vector3();
  let speed = 0.2;
  let runMultiplier = 2;
  let jumpForce = 0.35;
  let gravity = -0.02;
  let onGround = true;

  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  function animate() {
    requestAnimationFrame(animate);
    if (!player) return;

    let moveSpeed = keys['ShiftLeft'] ? speed * runMultiplier : speed;

    if (keys['KeyW']) player.position.z -= moveSpeed;
    if (keys['KeyS']) player.position.z += moveSpeed;
    if (keys['KeyA']) player.position.x -= moveSpeed;
    if (keys['KeyD']) player.position.x += moveSpeed;

    // Stamina diminui ao correr
    if (keys['ShiftLeft'] && stamina > 0) {
      stamina -= 0.2;
    } else if (stamina < 100) {
      stamina += 0.1; // recupera lentamente
    }

    // Pulo
    if (keys['Space'] && onGround) {
      velocity.y = jumpForce;
      onGround = false;
      energy -= 2; // gastar energia ao pular
      score += 10; // ganhar pontos ao realizar ação
    }

    // Gravidade
    if (!onGround) {
      velocity.y += gravity;
      player.position.y += velocity.y;
      if (player.position.y <= 1) {
        player.position.y = 1;
        velocity.y = 0;
        onGround = true;
      }
    }

    // Atualizar HUD
    updateHUD();

    // Câmera
    camera.position.set(player.position.x, player.position.y + 5, player.position.z + 15);
    camera.lookAt(player.position);

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
