<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Parkour 3D Urbano</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>

<script>
  // Cena, câmera e renderizador
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // céu azul
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Luz
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(10, 20, 10);
  scene.add(light);

  // Chão com textura
  const floorTexture = new THREE.TextureLoader().load("https://threejs.org/examples/textures/grasslight-big.jpg");
  floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
  floorTexture.repeat.set(50, 50);
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ map: floorTexture })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Paredes/prédios
  function criarPredio(x, z, altura) {
    const tex = new THREE.TextureLoader().load("https://threejs.org/examples/textures/brick_diffuse.jpg");
    const predio = new THREE.Mesh(
      new THREE.BoxGeometry(10, altura, 10),
      new THREE.MeshStandardMaterial({ map: tex })
    );
    predio.position.set(x, altura/2, z);
    scene.add(predio);
    return predio;
  }

  const obstaculos = [];
  obstaculos.push(criarPredio(20, 0, 15));
  obstaculos.push(criarPredio(-20, -10, 20));
  obstaculos.push(criarPredio(0, 30, 10));

  // Player (modelo GLTF)
  let player;
  const loader = new THREE.GLTFLoader();
  loader.load("https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb", function(gltf){
    player = gltf.scene;
    player.scale.set(0.5,0.5,0.5);
    player.position.set(0,1,0);
    scene.add(player);
  });

  // Movimento
  const keys = {};
  let velocity = new THREE.Vector3();
  let speed = 0.2;
  let runMultiplier = 2;
  let jumpForce = 0.35;
  let gravity = -0.02;
  let onGround = true;

  document.addEventListener('keydown', e => keys[e.code] = true);
  document.addEventListener('keyup', e => keys[e.code] = false);

  function animate() {
    requestAnimationFrame(animate);
    if (!player) return;

    let moveSpeed = keys['ShiftLeft'] ? speed * runMultiplier : speed;

    if (keys['KeyW']) player.position.z -= moveSpeed;
    if (keys['KeyS']) player.position.z += moveSpeed;
    if (keys['KeyA']) player.position.x -= moveSpeed;
    if (keys['KeyD']) player.position.x += moveSpeed;

    // Pulo
    if (keys['Space'] && onGround) {
      velocity.y = jumpForce;
      onGround = false;
    }

    // Gravidade
    if (!onGround) {
      velocity.y += gravity;
      player.position.y += velocity.y;
      if (player.position.y <= 1) {
        player.position.y = 1;
        velocity.y = 0;
        onGround = true;
      }
    }

    // Wall run
    obstaculos.forEach(obs => {
      const dist = player.position.distanceTo(obs.position);
      if (dist < 8 && keys['KeyW'] && keys['ShiftLeft']) {
        player.position.y += 0.05;
      }
    });

    // Wall jump
    obstaculos.forEach(obs => {
      const dist = player.position.distanceTo(obs.position);
      if (dist < 8 && keys['Space']) {
        velocity.y = jumpForce * 1.5;
        player.position.x += (player.position.x > obs.position.x ? 1 : -1) * 2;
      }
    });

    // Câmera dinâmica
    camera.position.set(player.position.x, player.position.y + 5, player.position.z + 15);
    camera.lookAt(player.position);

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
